; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
test_framework = unity
monitor_speed = 115200

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -DMY_WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DMY_WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -DMY_TELEMETRY_HOST=\"${sysenv.TELEMETRY_HOST}\"
    -DMY_LOGS_PORT=${sysenv.LOGS_PORT}
    -DMY_COMMANDS_PORT=${sysenv.COMMANDS_PORT}
    -DMY_STREAMER_PORT=${sysenv.STREAMER_PORT}

lib_deps =
    pololu/VL53L0X
    robtillaart/AS5600

[env:native]
platform = native
test_framework = unity

build_flags =
    -std=c++17
    -Iinclude
    -Ilib/Telemetry/src

